stages:
  - pre-build
  - build
  - check
  - release

include:
  - remote: https://gitlab.com/renovate-bot/renovate-runner/-/raw/v19.111.4/templates/renovate.gitlab-ci.yml
  - remote: https://gitlab.com/renovate-bot/renovate-runner/-/raw/v19.111.4/templates/renovate-config-validator.gitlab-ci.yml

.base:
  before_script:
    - set -euo pipefail
  tags:
    - d13-runner

.php:
  image: "$TWINT_SDK_PHP_IMAGE_BASE-$PHP_VERSION-$TWINT_SDK_PHP_CURL_SSL_ENGINE"
  parallel:
    matrix:
      - { PHP_VERSION: &php_version [ "8.1", "8.2", "8.3", "8.4" ], TWINT_SDK_PHP_CURL_SSL_ENGINE: &ssl_engine [ "openssl", "nss", "nss-nobignum", "gnutls" ] }
  extends: .base

.php-with-high-low-dependencies:
  parallel:
    matrix:
      - { PHP_VERSION: *php_version, TWINT_SDK_PHP_CURL_SSL_ENGINE: *ssl_engine, COMPOSER_DEPENDENCY_VERSION: [ "lowest", "highest" ] }
      - { PHP_VERSION: [ "8.1", "8.2"], TWINT_SDK_PHP_CURL_SSL_ENGINE: *ssl_engine, COMPOSER_DEPENDENCY_VERSION: [ "locked" ] }
  extends: .php

container-build-hash:
  stage: pre-build
  image: "alpine:3@sha256:25109184c71bdad752c8312a8623239686a9a2071e8825f20acb8f2198c3f659"
  script:
    - apk add --no-cache make jq git
    - make container-checksum
  extends: .base
  artifacts:
    reports:
      dotenv: .docker-env

container-build:
  stage: build
  image: "quay.io/podman/stable:v5.7.1-immutable@sha256:2c5155a0516a5fa5ae8ee277514c7d3e96dcdfc6b7ed7a41506ea185733767be"
  variables:
    TWINT_SDK_PHP_IMAGE_CACHE: $CI_REGISTRY_IMAGE/php
    # Required to make rootless podman work
    STORAGE_DRIVER: vfs
  resource_group: container-build-$PHP_VERSION
  timeout: 2h
  script:
    - yum install -y make jq
    - make php-extensions
    - podman login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" $CI_REGISTRY
    - podman login -u "$DOCKER_USER" -p "$DOCKER_TOKEN" docker.io
    - >-
      podman build
      --pull=newer
      --build-context php_base_image=docker-image://php:$PHP_VERSION-cli-bookworm
      --cache-from $TWINT_SDK_PHP_IMAGE_CACHE
      --cache-to $TWINT_SDK_PHP_IMAGE_CACHE
      --env TWINT_SDK_PHP_CURL_SSL_ENGINE=$TWINT_SDK_PHP_CURL_SSL_ENGINE
      --label "org.opencontainers.image.title=$CI_PROJECT_TITLE"
      --label "org.opencontainers.image.url=$CI_PROJECT_URL"
      --label "org.opencontainers.image.created=$CI_JOB_STARTED_AT"
      --label "org.opencontainers.image.revision=$CI_COMMIT_SHA"
      --label "org.opencontainers.image.version=$CI_COMMIT_REF_NAME"
      --tag $TWINT_SDK_PHP_IMAGE_BASE-$PHP_VERSION-$TWINT_SDK_PHP_CURL_SSL_ENGINE
      -f Dockerfile
      $PWD
    - podman push $TWINT_SDK_PHP_IMAGE_BASE-$PHP_VERSION-$TWINT_SDK_PHP_CURL_SSL_ENGINE
  extends: .php
  needs:
    - job: container-build-hash
      artifacts: true
  only:
    changes:
      - php-extensions.txt
      - Dockerfile
      - .gitlab-ci.yml
      - Makefile

docs:
  stage: build
  image: sphinxdoc/sphinx:8.2.3@sha256:8d8bdb4649e6577f20ca9a84ef1e1d46911dc65678fe7908b2e2d3a39508e1c8
  script:
    - mkdir -p build
    - make docs
    - cp -r build/docs/html docs
  extends: .base
  needs: []
  artifacts:
    name: "Documentation"
    paths:
      - docs/**/*

check:
  stage: check
  variables:
    XDEBUG_MODE: coverage
    COMPOSER_ALLOW_SUPERUSER: "true"
  services:
    - name: "wiremock/wiremock:3x@sha256:56298733dda5f6ec3c05136a1e4f08efb5048e8e970334aa4b8580b12cd28498"
      alias: wiremock
  script:
    - cp ${TWINT_SDK_CI_DOT_ENV} .env
    - mkdir -p build
    - cat ${TWINT_SDK_CI_CERT} | base64 -d > build/certificate.p12
    - make install
    - make wiremock-setup
    - make check
  extends: .php-with-high-low-dependencies
  coverage: '/Lines:\s+\d+(?:\.\d+)?%/'
  artifacts:
    reports:
      # Needs GitLab 14.10
      #coverage: build/coverage/clover.xml
      junit: build/junit.xml
      codequality:
        - build/phpstan-src.json
        # See https://gitlab.com/gitlab-org/gitlab/-/issues/351546
        #- build/phpstan-docs.json
  needs:
    - job: container-build-hash
      artifacts: true
    - job: container-build
      optional: true
      artifacts: false

renovate:
  variables:
    RENOVATE_EXTRA_FLAGS: "$CI_PROJECT_NAMESPACE/$CI_PROJECT_NAME"
    RENOVATE_ALLOWED_POST_UPGRADE_COMMANDS: ^composer upgrade --no-scripts .*$
    RENOVATE_LOG_LEVEL: debug
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  stage: build
  tags:
    - d13-runner
  needs: []

renovate-config-validator:
  variables:
    RENOVATE_CONFIG_VALIDATOR_EXTRA_FLAGS: "--strict"
  stage: check
  tags:
    - d13-runner
  needs: []

release:
  image: "$TWINT_SDK_PHP_IMAGE_BASE-8.3-openssl"
  extends: .base
  needs:
    - job: container-build-hash
      artifacts: true
    - job: check
  stage: release
  only: [ "tags" ]
  variables:
    GIT_DEPTH: 0
  script:
    - make release
