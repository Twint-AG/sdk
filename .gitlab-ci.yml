stages:
  - pre-build
  - build
  - check

include:
  - remote: https://gitlab.com/renovate-bot/renovate-runner/-/raw/v19.111.4/templates/renovate.gitlab-ci.yml
  - remote: https://gitlab.com/renovate-bot/renovate-runner/-/raw/v19.111.4/templates/renovate-config-validator.gitlab-ci.yml

.base:
  interruptible: true
  before_script:
    - set -euo pipefail
  tags:
    - d13-runner

plan:
  stage: pre-build
  image: "alpine:3@sha256:5b10f432ef3da1b8d4c7eb6c487f2f5a8f096bc91145e68878dd4a5019afde11"
  extends: .base
  script:
    - apk add --no-cache git curl bash skopeo jsonnet coreutils
    - curl --proto '=https' --tlsv1.2 -sSf https://just.systems/install.sh | bash -s -- --to /usr/local/bin
    - just container-checksum
    - set -a; . ./.docker-env; set +a
    - skopeo login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
    - TWINT_SDK_PHP_MISSING_TAGS="$(./ci/probe-missing-tags.sh)"
    - TWINT_SDK_PHP_VERSIONS="$(ls resources-dev/php | paste -sd, -)"
    - 'echo "Missing image tags: ${TWINT_SDK_PHP_MISSING_TAGS:-<none>}"'
    - >-
      jsonnet
      --ext-str TWINT_SDK_PHP_IMAGE_BASE="$TWINT_SDK_PHP_IMAGE_BASE"
      --ext-str TWINT_SDK_PHP_MISSING_TAGS="$TWINT_SDK_PHP_MISSING_TAGS"
      --ext-str TWINT_SDK_PHP_VERSIONS="$TWINT_SDK_PHP_VERSIONS"
      ci/pipeline.jsonnet > generated-pipeline.yml
  artifacts:
    paths:
      - generated-pipeline.yml
    reports:
      dotenv: .docker-env

build:
  stage: build
  needs:
    - job: plan
      artifacts: true
  trigger:
    include:
      - artifact: generated-pipeline.yml
        job: plan
    strategy: depend

docs:
  stage: build
  image: sphinxdoc/sphinx:8.2.3@sha256:8d8bdb4649e6577f20ca9a84ef1e1d46911dc65678fe7908b2e2d3a39508e1c8
  extends: .base
  needs: []
  script:
    - mkdir -p build
    - sphinx-build -M html resources/docs build/docs -W
    - cp -r build/docs/html docs
  artifacts:
    name: "Documentation"
    paths:
      - docs/**/*

renovate:
  variables:
    RENOVATE_EXTRA_FLAGS: "$CI_PROJECT_NAMESPACE/$CI_PROJECT_NAME"
    RENOVATE_ALLOWED_POST_UPGRADE_COMMANDS: ^composer upgrade --no-scripts .*$
    RENOVATE_LOG_LEVEL: debug
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  stage: build
  tags:
    - d13-runner
  needs: []

renovate-config-validator:
  variables:
    RENOVATE_CONFIG_VALIDATOR_EXTRA_FLAGS: "--strict"
  stage: check
  tags:
    - d13-runner
  needs: []
