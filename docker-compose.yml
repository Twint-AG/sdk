services:
  php:
    build:
      additional_contexts:
        php_base_image: docker-image://${TWINT_SDK_PHP_BASE_IMAGE}
      args:
        TWINT_SDK_PHP_CURL_SSL_ENGINE: ${TWINT_SDK_PHP_CURL_SSL_ENGINE}
    entrypoint: [sleep, infinity]
    working_dir: /src
    environment:
      - XDEBUG_MODE=coverage
    stop_signal: SIGKILL
    volumes:
      - ./:/src
    depends_on:
        - wiremock

  wiremock:
    image: wiremock/wiremock:3x@sha256:0d4ecb3e4dc8213fd7a4d37d6a78f6e6b553a6d2e15bd51b0999781282ac61b3
    entrypoint: [/docker-entrypoint.sh, --verbose]

  jsonnet:
    image: akamai/jsonnet:v2.33.8@sha256:6e3d0af36e490bb1e7dc1166de0dcd17b6bea8d9323adc1647b06bfe6efd732c
    entrypoint: []
    working_dir: /src
    volumes:
      - ./:/src
    profiles: [tools]

  sphinx:
    image: sphinxdoc/sphinx:8.2.3@sha256:8d8bdb4649e6577f20ca9a84ef1e1d46911dc65678fe7908b2e2d3a39508e1c8
    entrypoint: [bash, -c, "apt-get update -qq && apt-get install -y -qq curl >/dev/null && curl --proto '=https' --tlsv1.2 -sSf https://just.systems/install.sh | bash -s -- --to /usr/local/bin && sleep infinity"]
    working_dir: /src
    volumes:
      - ./:/src
    stop_signal: SIGKILL
